<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031c33">

  <title>Pago | Puerto 27</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #07506a 0%, #032a46 30%, #02192d 65%, #011322 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 18px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .business-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9fb5c5;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 25px 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      text-align: left;
    }

    .label {
      color: #89a4b7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 7px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .clabe {
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .8px;
      word-break: break-all;
      margin-bottom: 14px;
    }

    .copy-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #00a9c7, #008aa7);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .copy-button:active {
      transform: scale(.98);
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
      color: #66e0b6;
      font-size: 14px;
      font-weight: 600;
    }

    .divider {
      width: 55px;
      height: 3px;
      background: #ff922b;
      border-radius: 10px;
      margin: 25px auto;
    }

    .instructions {
      color: #b7c7d3;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .spei {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      color: #8da6b7;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 25px;
      color: #668095;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="logo.png"
      alt="Puerto 27"
      class="logo"
    >

    <h1 class="business-name">Puerto 27</h1>
    <p class="subtitle">Realiza tu pago por transferencia</p>

    <section class="card">

      <p class="label">Beneficiario</p>
      <p class="value">Edna Monserrath Gil Diaz</p>

      <p class="label">Institución</p>
      <p class="value">Mercado Pago W</p>

      <p class="label">CLABE</p>
      <p class="clabe" id="clabe">722969020242031867</p>

      <button class="copy-button" onclick="copiarClabe()">
        Copiar CLABE
      </button>

      <div class="status" id="status"></div>

      <div class="divider"></div>

      <p class="instructions">
        Copia la CLABE, abre la aplicación de tu banco
        y realiza tu transferencia.
      </p>

      <div style="text-align:center;">
        <span class="spei">TRANSFERENCIA SPEI</span>
      </div>

    </section>

    <p class="footer">
      Verifica los datos antes de realizar tu transferencia.
    </p>

  </main>

  <script>
    function copiarClabe() {
      const clabe = document.getElementById("clabe").innerText;
      const status = document.getElementById("status");

      navigator.clipboard.writeText(clabe)
        .then(() => {
          status.innerText = "✓ CLABE copiada";
          setTimeout(() => {
            status.innerText = "";
          }, 2500);
        })
        .catch(() => {
          const textarea = document.createElement("textarea");
          textarea.value = clabe;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);

          status.innerText = "✓ CLABE copiada";
        });
    }
  </script>

</body>
</html>
